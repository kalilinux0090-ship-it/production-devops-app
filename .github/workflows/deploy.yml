name: Production Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker Image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/production-devops-app:latest .

    - name: Push Docker Image
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/production-devops-app:latest

    - name: Deploy to EC2
      uses: appleboy/ssh-action@v0.1.6
      with:
        host: 13.232.82.158
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}       
        script: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/production-devops-app:latest
          docker stop prod-app || true
          docker rm prod-app || true
          docker run -d -p 80:5000 --name prod-app ${{ secrets.DOCKER_USERNAME }}/production-devops-app:latest
